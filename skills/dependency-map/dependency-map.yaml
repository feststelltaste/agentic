# Settings of dependency-map. Edit this file, never the script.
#
# Provenance of the numbers: [own] our decision, a starting point to tune per codebase. Nothing here comes from a vendor.
# These are the neutral defaults. What differs for one repository (a vendored folder, a ticket pattern, a threshold) goes into an
# override file, `--config <file>`, that holds only those keys; it is merged over this file. Per-language knowledge (how a class or
# module is named in a string, where routes are declared, where names are built at run time) is in scripts/ecosystems.py; the
# ecosystems found in the repository are detected, `ecosystems:` can fix them.

scope:
  ecosystems: auto               # auto = every language with at least 3 code files; or a list: [java, python, php, ruby, javascript, c]
  extensions: auto               # auto = the code files of those ecosystems plus the usual data, template and configuration files; or a list
  exclude:                       # regular expressions on repo-relative paths
    - '(^|/)(node_modules|vendor|bower_components|third_party|3rdparty|target|build|dist|out|__pycache__|\.venv|venv|site-packages)/'
    - '(^|/)src/test/'
    - '\.min\.(js|css)$'
  max_file_kb: 2048              # [own] larger files are skipped (generated, data dumps)

wiring:                          # XML that names Java classes: Spring beans, web.xml, Hibernate mappings
  enabled: true

url_links:                       # a template, script or class that names a URL a servlet is mapped to
  enabled: true
  min_pattern_length: 4          # [own] shorter patterns match chance text ("/a", "/ui")
  max_generic_sources: 15        # [own] a pattern that is one plain lowercase word (`customer`, `form`) and is named by more files than this is an ordinary word, not a link: counted, no edges
  ignore_route_sources: ['(?i)(^|/)(tests?|spec|__tests__|testing)/', '(?i)(_test|_spec|\.test|\.spec|Test)\.\w+$']   # [own] a route declared in a test is not an endpoint of the application
  ignore_patterns: ['/']         # mappings that say nothing (the default servlet)
  ignore_sources: []             # regular expressions on paths of files that are not to be read for URLs, e.g. a vendored script library

tables:                          # classes, mappings and templates that use a table the changelogs and SQL scripts create
  enabled: true
  min_name_length: 4             # [own] shorter names are mostly ordinary words
  context: 'from|join|into|update|table|delete\s+from|alter\s+table|references'   # an SQL keyword must precede the name
  skip_names: []                 # table names to ignore although they match, e.g. generic ones

co_change:                       # files that change together in Git: evidence, not a rule
  enabled: true
  since_months: 0                # [own] 0 = the whole history; otherwise months before the last change to the sources
  max_files_per_commit: 30       # [own] larger commits (renames, formatting, imports) are left out
  min_commits_together: 5        # [own] support: the pair changed together at least this often
  min_confidence: 0.50           # [own] share of the less-changed file's commits that included the other file

string_classes:                  # a class named by its full name as text: reflection, JSON, properties, seed data, other XML
  enabled: true

dynamic_lookups:                 # code that builds or looks up names at run time: the radius there is a lower bound
  enabled: true
  ignore_sources: []             # regular expressions on paths whose dynamic sites are not reported, e.g. a vendored script library
  calls: ['forName', 'loadClass', 'getBean', 'getMethod', 'getDeclaredMethod', 'getField', 'getDeclaredField']   # calls on an object: `.name(`
  # A call with a string literal is resolved where possible (getBean: bean id, Class.forName: class name); with any other
  # argument it is reported as a dynamic site. Not reported: a constant (SOME_NAME), a type (`Foo.class`), a call without
  # an argument (a getter), and getField/getMethod in a file that does not use reflection. newInstance() is not listed: it is
  # mostly the factory idiom (DocumentBuilderFactory.newInstance()), not reflection.

names:                           # connascence of name: an identifier that must be spelled the same in code and in another artifact
  enabled: true
  min_length: 8                  # [own] shorter identifiers are mostly ordinary words
  min_humps: 2                   # [own] at least this many words in camelCase (customerOrderId has 3); one-word names are too generic
  max_declaring_files: 3         # [own] an identifier declared in more classes than this says nothing about one of them
  skip: []                       # identifiers to ignore although they match, e.g. a framework attribute such as schemaLocation
  max_spread_files: 60           # [own] an identifier found in more files than this is a name hub: reported, but no edges

change_coupling:                 # change coupling, per commit and per ticket, compared with what is already known (change_coupling.py)
  max_files_per_commit: 30       # [own] larger commits (renames, formatting, imports) are left out
  max_files_per_ticket: 60       # [own] a ticket that touched more files than this is too broad to say anything about a pair
  min_revisions: 5               # [own] a file needs at least this many changesets before it can be coupled
  min_shared: 5                  # [own] a pair needs at least this many shared changesets (the support)
  min_degree: 30                 # [own] percent; degree = shared / ((revisions_a + revisions_b) / 2)
  ticket_patterns:               # [own] regular expressions on the commit message; group 1 is the ticket id. A commit without a match has no ticket.
    - '\b([A-Za-z]{2,10}-\d{2,6})\b'          # PROJ-123, MR-12, issue-7
    - '^\s*#?(\d{4,8})\s*[:\-]'               # 14763: Migrating ...   (a number in front, from another tracker)
    - '\(#(\d{1,7})\)'                            # Fix the thing (#1234): a GitHub pull request or issue in the subject
    - '(?i)\b(?:fix(?:e[sd])?|close[sd]?|resolve[sd]?)\s+#(\d{1,7})\b'   # fixes #1234
  known_edge_kinds: [use, links, names]       # dependency-map edges that count as "already known" next to the code edges; tables are checked separately
  known_max_steps: 2                          # [own] a path of at most this many steps counts as an explanation; a longer chain through shared files explains nothing
  ignore: ['(^|/)(pom\.xml|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|Gemfile\.lock|poetry\.lock|Cargo\.lock|go\.sum)$']   # [own] files that change together by design (a version bump, a lock file)

file_names:                      # a string in code or configuration that is the name of another file of the repository (a resource, a query file, a template)
  enabled: true
  min_name_length: 8             # [own] "a.xml" matches too much; the whole file name including the extension counts
  max_same_name: 6               # [own] a file name shared by more files than this (`index.js`, `__init__.py`) does not say which one is meant: no edges
  extensions: auto               # auto = every file type in scope; or a list

keys:                            # a key spelled the same in code and in a data file: a query name, a message key, a property key
  enabled: true
  min_length: 8                  # [own]
  max_code_files: 3              # [own] a string used in more code files than this is a common word, not a key between two places
  max_data_files: 3              # [own] the same for the data files that contain it
  ignore_sources: []             # regular expressions on paths of files that are not to be read for keys, e.g. a vendored script library
  view_extensions: [jsp, tag, html, htm, js, ejs, erb, twig, phtml, hbs, jinja, j2]   # templates and scripts that read a key the code sets (a request attribute, a parameter, a model key): the view depends on the code

patterns:                        # why might a coupled pair change together? Hypotheses with evidence, never a verdict (change_coupling.py)
  clone_similarity: 0.70         # [own] line similarity of the two files at or above which they count as copies of each other
  rare_max_files: 6              # [own] a word found in more files than this is not a shared concept between two files
  rare_min_length: 6             # [own]
  min_shared_rare: 3             # [own] shared rare words needed for "shared vocabulary"
  min_shared_name_parts: 2       # [own] parts of the file names (print, repeating, item ...) two files in one folder must share for "naming family"
  burst_days: 120                # [own] the shared commits fall within this many days ...
  burst_share: 0.80              # [own] ... for at least this share of them: a single event (a refactoring, a feature, a release) rather than a standing link
  persistent_days: 365           # [own] shared commits spread over at least this span, and not a burst: a standing link
  one_person_share: 0.80         # [own] one author wrote at least this share of the shared commits
  bulk_files: 12                 # [own] the median size of the shared commits is at least this many files: mostly mechanical changes
  max_lines_for_similarity: 4000 # [own] longer files are not compared line by line
  layers:                        # [own] first match wins; used to tell a vertical slice (different layers) from siblings (the same layer)
    - {name: migration, pattern: '(?i)(/migrations?/|changelog|\.sql$)'}
    - {name: test, pattern: '(?i)(^|/)(tests?|spec|__tests__)/|(_test|\.test|\.spec|Test)\.\w+$'}
    - {name: docs, pattern: '(?i)(^|/)docs?/|\.(md|rst|txt)$'}
    - {name: ui, pattern: '(?i)(\.(jsp|tag|html?|css|scss|ejs|erb|twig|phtml|hbs|jinja2?|j2)$|/(webapp|templates?|views?|public|static|assets)/)'}
    - {name: data access, pattern: '(?i)(/dao/|dao\.\w+$|/hibernate/|/repositor(y|ies)/|/models?/)'}
    - {name: service/logic, pattern: '(?i)(/services?/|/logic/|/rules?/|/core/|/lib/)'}
    - {name: web, pattern: '(?i)(/control(ler)?s?/|/servlets?/|/rest(ful)?/|/web/|/routes?/|/handlers?/|/api/)'}
    - {name: build, pattern: '(?i)(^|/)(Makefile|CMakeLists\.txt|Rakefile|Gemfile|Dockerfile|package\.json|composer\.json|pyproject\.toml|setup\.(py|cfg)|tox\.ini|pom\.xml|build\.gradle)$|\.(cmake|mk)$'}
    - {name: configuration, pattern: '(?i)\.(xml|properties|ya?ml|json|toml|ini|cfg)$'}
